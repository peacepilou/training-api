name: CI Back

on:
  push:
    branches-ignore:
      - main
      - development

  pull_request:
    branches:
      - main
      - development

jobs:
  static-analysis:
    name: Back PMD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run PMD
        run: mvn -B compile pmd:check

  unit-tests:
    name: Back Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run unit tests
        run: mvn -B test -Dtest='**/unit/**'

  integration-tests:
    name: Back Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Tous les tests sauf unit/ et e2e/ : integration/, repository/ et le test de démarrage, sur H2
      - name: Run integration tests
        run: mvn -B test -Dtest='!**/unit/**, !**/e2e/**'

  build:
    name: Back Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Les tests tournent dans leurs propres jobs
      - name: Build the jar
        run: mvn -B package -DskipTests

  e2e-tests:
    name: Back E2E Tests
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-tests, integration-tests, build]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Testcontainers lance lui-même MySQL 8.4 avec les scripts de database/ : Docker est déjà sur la machine
      - name: Run E2E tests
        run: mvn -B test -Dtest='**/e2e/**'
