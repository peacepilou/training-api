# Profil des tests d'intégration : base H2 en mémoire, aucune valeur lue dans le .env
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 ne connaît pas database/schema.sql : Hibernate crée les tables depuis les entités, puis les jette.
# Les CHECK et les ON DELETE CASCADE du vrai schéma ne sont donc pas testés ici
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

logging.level.org.springframework.web=info

cors.allowedOrigins=http://localhost:4200

# Clé de test uniquement, jamais utilisée ailleurs
jwt.secret=dGVzdC1zZWNyZXQtZm9yLWludGVncmF0aW9uLXRlc3RzLW9ubHkh
jwt.expiration-ms=3600000

# Sans .env, ${MONGODB_URI_DEV} n'existe pas et le contexte refuse de démarrer.
# Aucun test d'intégration ne lit ni n'écrit le journal : le client MongoDB est créé, il ne se connecte qu'au premier appel
spring.mongodb.uri=mongodb://localhost:27017/candle_shop_test
logging.level.org.mongodb.driver.cluster=warn
