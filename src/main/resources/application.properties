spring.application.name=eshop_api

# Charge le .env de la racine du projet s'il existe (format clé=valeur, lu comme un .properties)
spring.config.import=optional:file:.env[.properties]

# Le compte limité à SELECT, INSERT, UPDATE, DELETE du module SQL, jamais root
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Les tables viennent de database/schema.sql : Hibernate vérifie au démarrage que les entités
# collent aux tables, sans jamais les modifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.web=debug

cors.allowedOrigins=${CLIENT_URL}
