spring.application.name=eshop_api

# Charge le .env de la racine du projet s'il existe (format clé=valeur, lu comme un .properties)
spring.config.import=optional:file:.env[.properties]

# Le compte limité à SELECT, INSERT, UPDATE, DELETE du module SQL, jamais root
spring.datasource.url=jdbc:mysql://${DB_HOST_DEV}:${DB_PORT_DEV}/${DB_NAME_DEV}
spring.datasource.username=${DB_USER_DEV}
spring.datasource.password=${DB_PASSWORD_DEV}

# Les tables viennent de database/schema.sql : Hibernate vérifie au démarrage que les entités
# collent aux tables, sans jamais les modifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.web=debug

cors.allowedOrigins=${CLIENT_URL_DEV}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}
