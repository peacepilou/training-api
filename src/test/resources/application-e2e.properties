# Profil des tests de bout en bout : la connexion MySQL vient du conteneur Testcontainers (@ServiceConnection)
spring.jpa.show-sql=false
logging.level.org.springframework.web=info

cors.allowedOrigins=http://localhost:4200

# Clé de test uniquement, jamais utilisée ailleurs
jwt.secret=dGVzdC1zZWNyZXQtZm9yLWludGVncmF0aW9uLXRlc3RzLW9ubHkh
jwt.expiration-ms=3600000

# Sans .env, ${MONGODB_URI} n'existe pas et le contexte refuse de démarrer.
# Le parcours E2E ne lit pas le journal des recherches : le client MongoDB est créé, il ne se connecte qu'au premier appel
spring.mongodb.uri=mongodb://localhost:27017/candle_shop_test
logging.level.org.mongodb.driver.cluster=warn
