# Modèle du fichier à poser sur le VPS, dans ~/backend/staging/ : deploy.sh y lance docker compose pull, puis up -d --wait.
# À côté : le .env (tiré de .env.sample), et les dossiers database/ et docker/ du dépôt, dont MySQL et MongoDB lisent les scripts.
# DOMAINE FACTICE : remplace example.com par le domaine de ton équipe.
name: backend-staging # sans lui, le projet prendrait le nom du dossier, « staging », comme celui du front

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      # Joués par ordre alphabétique, une seule fois, quand mysql_data est encore vide
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/security.sql:/docker-entrypoint-initdb.d/03-security.sql:ro
      - ./docker/mysql/candle-app-user.sh:/docker-entrypoint-initdb.d/04-candle-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s # au premier démarrage, MySQL joue ses scripts d'init avant de répondre

  mongo:
    image: mongo:8.2
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/candle-app-user.sh:/docker-entrypoint-initdb.d/candle-app-user.sh:ro
    # Sans lui, deploy.sh ne verrait pas un MongoDB qui redémarre en boucle
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  api:
    image: ghcr.io/peacepilou/training-api:staging # poussée par cd-back.yml
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: candle_shop # le nom que crée database/schema.sql
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MONGODB_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/candle_shop
      CLIENT_URL: ${CLIENT_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      # application.properties est réglé pour développer : en ligne, ni logs de debug ni requêtes SQL affichées
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: info
      SPRING_JPA_SHOW_SQL: "false"
    # deploy.sh attend ce test : s'il échoue, le déploiement finit en rouge.
    # La liste, publique et sans cache : elle répond 200 même table vide, et lit MySQL à chaque appel
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null 'http://127.0.0.1:8080/candles?size=1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s # Spring démarre lentement sur un petit VPS : aucun échec compté avant 3 minutes
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_started
    # Le réseau du projet pour joindre mysql et mongo, celui de Traefik pour recevoir les requêtes
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik" # l'API est sur deux réseaux : Traefik doit la joindre par le sien
      - "traefik.http.routers.backend-staging.rule=Host(`staging-api.example.com`)"
      - "traefik.http.routers.backend-staging.entrypoints=websecure"
      - "traefik.http.routers.backend-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend-staging.loadbalancer.server.port=8080" # Spring Boot écoute sur le 8080 du conteneur

volumes:
  mysql_data:
  mongo_data:

networks:
  traefik:
    external: true
